<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Waking Dream | Coming Soon</title>
    <meta
      name="description"
      content="Waking Dream is coming soon. A cinematic director's vision is taking shape."
    />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;500;600&family=Montserrat:wght@400;500;600&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <main class="hero">
      <img class="chair" src="./assets/Chair.jpg" alt="Director chair" />
      <section class="copy">
        <p class="brand">WAKING DREAM</p>
        <h1>Your stage is almost set.</h1>
      </section>
      <section class="beta-card" aria-label="Apply for private beta">
        <p class="beta-title">Private Beta</p>
        <form class="beta-form" action="#" method="post">
          <label for="name">Name</label>
          <input id="name" name="name" type="text" autocomplete="name" required />

          <label for="email">Email</label>
          <input id="email" name="email" type="email" autocomplete="email" required />

          <label for="experience">Film creation experience</label>
          <select id="experience" name="experience" required>
            <option value="" selected disabled>Select one</option>
            <option value="none">No prior experience</option>
            <option value="some">Some experience</option>
            <option value="pro">Professional creator</option>
          </select>

          <button type="submit">Apply for Beta</button>
        </form>
      </section>
      <footer class="footer-note">Waking Dream Technology</footer>
    </main>
  </body>
</html>
